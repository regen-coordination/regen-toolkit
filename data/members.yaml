schema_version: "2.0"

# Members Registry
#
# Consumed by:
#   - scripts/linear/lib/members.mjs   → resolveOwner(), maps HEARTBEAT.md owner hints to a person
#   - scripts/generate-all-schemas.mjs → .well-known/members.json (reads `id` only)
#   - scripts/initialize.mjs           → dashboard
#
# `aliases` are every spelling that appears as an owner prefix in HEARTBEAT.md or as an
# attendee name in packages/operations/meetings/. Matching is case- and whitespace-insensitive
# and unicode-normalized, so only genuinely distinct spellings need listing. An alias claimed
# by two members is a hard validation error — that is the identity fork this registry exists
# to prevent.
#
# `linear_email` may be null. A task whose owner has no Linear account seeds unassigned with a
# `needs-assignee` label and the owner named in the issue footer; re-running the sync after
# they join fills it in. Owner of record is never lost.

members:
  - id: luiz
    name: Luiz Fernando
    role: operator
    aliases: [Luiz]
    linear_email: luizfernandolfsg@gmail.com

  - id: matty
    name: Matty Compost
    role: master-doc-author
    aliases: [Matt, Matty, Mattycompost]
    linear_email: matt@greenpill.builders

  - id: afo
    name: Afolabi Aiyeloja
    role: project-management
    aliases: [Afo]
    linear_email: afo@greenpill.builders

  - id: rather
    name: rather mercurial
    role: engineering
    aliases: [Rather, Rathermercurial]
    linear_email: rathermercurial@protonmail.com

